name: CI Execution

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    # ----------------------------------------------------
    # 1. Checkout
    # ----------------------------------------------------
    - name: Checkout source code
      uses: actions/checkout@v4

    # ----------------------------------------------------
    # 2. Setup Java
    # ----------------------------------------------------
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    # ----------------------------------------------------
    # 3. Linting
    # ----------------------------------------------------
    - name: Run Maven Checkstyle
      run: mvn checkstyle:check || echo "Checkstyle warnings found but continuing"
      continue-on-error: true

    # ----------------------------------------------------
    # 4. SAST - CodeQL
    # ----------------------------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java

    - name: CodeQL Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

    # ----------------------------------------------------
    # 5. SCA - Dependency Vulnerability Scan
    # ----------------------------------------------------
    - name: OWASP Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=9 \
          -DsuppressionFiles=.github/dependency-check-suppressions.xml
      continue-on-error: false

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: |
          target/dependency-check-report.html
          target/dependency-check-report.json
        if-no-files-found: ignore
        retention-days: 30
      continue-on-error: true

    # ----------------------------------------------------
    # 6. Unit Testing
    # ----------------------------------------------------
    - name: Run Unit Tests
      run: mvn test

    # ----------------------------------------------------
    # 7. Build Application
    # ----------------------------------------------------
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # ----------------------------------------------------
    # 8. Docker Build
    # ----------------------------------------------------
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest \
          ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:${{ github.sha }}

    # ----------------------------------------------------
    # 9. Trivy - Container Image Security Scan
    # ----------------------------------------------------
    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@0.24.0
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        ignore-unfixed: true

    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
      continue-on-error: true

    # ----------------------------------------------------
    # 10. Docker Container Basic Testing
    # ----------------------------------------------------
    - name: Run container and test
      run: |
        docker run -d -p 8080:8080 --name test-app \
          ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest
        sleep 20
        curl -f http://localhost:8080/health || exit 1
        curl -f -X POST http://localhost:8080/notes \
          -H "Content-Type: application/json" \
          -d '{"title":"CI Test","content":"Automated testing"}' || exit 1
        curl -f http://localhost:8080/notes || exit 1
        docker logs test-app
        docker stop test-app
        docker rm test-app

    # ----------------------------------------------------
    # 11. Login to DockerHub
    # ----------------------------------------------------
    - name: Login to DockerHub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ----------------------------------------------------
    # 12. Push Docker Image
    # ----------------------------------------------------
    - name: Push Image to DockerHub
      if: github.event_name == 'push'
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:${{ github.sha }}
