name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    # 1. Checkout Code
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    # 2. Setup Kubernetes (Kind)
    - name: ☸️ Create Kubernetes Cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: notes-cluster
        wait: 60s
    
    # 3. Verify Cluster
    - name: 🔍 Verify Kubernetes Cluster
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    # 4. Create Kubernetes Deployment
    - name: 🚀 Deploy Application to Kubernetes
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: notes-api
          labels:
            app: notes-api
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: notes-api
          template:
            metadata:
              labels:
                app: notes-api
            spec:
              containers:
              - name: notes-api
                image: ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest
                ports:
                - containerPort: 8080
                  name: http
                env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prod"
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 20
                  periodSeconds: 5
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "250m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: notes-api-service
          labels:
            app: notes-api
        spec:
          type: NodePort
          selector:
            app: notes-api
          ports:
          - port: 8080
            targetPort: 8080
            protocol: TCP
            name: http
        EOF
    
    # 5. Wait for Deployment
    - name: ⏳ Wait for Deployment to be Ready
      run: |
        echo "Waiting for deployment to be ready..."
        kubectl rollout status deployment/notes-api --timeout=300s
        
        echo "Deployment status:"
        kubectl get deployments
        
        echo "Pod status:"
        kubectl get pods
        
        echo "Service status:"
        kubectl get services
    
    # 6. Port Forward for Testing
    - name: 🔌 Setup Port Forward
      run: |
        kubectl port-forward service/notes-api-service 8080:8080 &
        sleep 10
    
    # 7. Health Check Validation
    - name: 🏥 Health Check Validation
      run: |
        echo "Testing health endpoint..."
        for i in {1..10}; do
          if curl -f http://localhost:8080/health; then
            echo "✅ Health check passed!"
            break
          else
            echo "Attempt $i failed, retrying..."
            sleep 5
          fi
        done
    
    # 8. DAST - Dynamic Application Security Testing
    - name: 🔒 DAST - Basic Security Tests
      run: |
        echo "Running basic DAST tests..."
        
        # Test 1: Health endpoint accessibility
        echo "Test 1: Health endpoint"
        curl -f http://localhost:8080/health
        
        # Test 2: Create note functionality
        echo "Test 2: Create note"
        curl -f -X POST http://localhost:8080/notes \
          -H "Content-Type: application/json" \
          -d '{"title":"DAST Test","content":"Testing security"}'
        
        # Test 3: Get notes functionality
        echo "Test 3: Get all notes"
        curl -f http://localhost:8080/notes
        
        # Test 4: Invalid input validation
        echo "Test 4: Validation test"
        curl -X POST http://localhost:8080/notes \
          -H "Content-Type: application/json" \
          -d '{"title":"","content":""}' | grep "Validation failed"
        
        echo "✅ All DAST tests passed!"
    
    # 9. Deployment Verification
    - name: ✅ Verify Deployment
      run: |
        echo "## CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Kubernetes Cluster: Created" >> $GITHUB_STEP_SUMMARY
        echo "✅ Deployment: Successful (2 replicas)" >> $GITHUB_STEP_SUMMARY
        echo "✅ Service: Exposed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Health Check: Passing" >> $GITHUB_STEP_SUMMARY
        echo "✅ DAST Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
        kubectl get all >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Pod Logs (Last 20 lines)" >> $GITHUB_STEP_SUMMARY
        POD_NAME=$(kubectl get pods -l app=notes-api -o jsonpath='{.items[0].metadata.name}')
        kubectl logs $POD_NAME --tail=20 >> $GITHUB_STEP_SUMMARY || true
    
    # 10. Cleanup
    - name: 🧹 Cleanup
      if: always()
      run: |
        echo "Deployment completed successfully!"
        echo "In production, the cluster would remain running."
        echo "For this demo, Kind cluster will be cleaned up automatically."
