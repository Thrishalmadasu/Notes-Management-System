name: CD Execution

on:
  workflow_run:
    workflows: ["CI Execution"]
    types:
      - completed
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    # ----------------------------------------------------
    # 1. Checkout
    # ----------------------------------------------------
    - name: Checkout source code
      uses: actions/checkout@v4
    
    # ----------------------------------------------------
    # 2. Setup Kubernetes
    # ----------------------------------------------------
    - name: Create Kubernetes Cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: notes-cluster
        wait: 60s
    
    - name: Verify Kubernetes Cluster
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    # ----------------------------------------------------
    # 3. Deploy Application
    # ----------------------------------------------------
    - name: Deploy to Kubernetes
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: notes-api
          labels:
            app: notes-api
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: notes-api
          template:
            metadata:
              labels:
                app: notes-api
            spec:
              containers:
              - name: notes-api
                image: ${{ secrets.DOCKERHUB_USERNAME }}/notes-management-system:latest
                ports:
                - containerPort: 8080
                  name: http
                env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prod"
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 20
                  periodSeconds: 5
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "250m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: notes-api-service
          labels:
            app: notes-api
        spec:
          type: NodePort
          selector:
            app: notes-api
          ports:
          - port: 8080
            targetPort: 8080
            protocol: TCP
            name: http
        EOF
    
    # ----------------------------------------------------
    # 4. Wait for Deployment
    # ----------------------------------------------------
    - name: Wait for deployment rollout
      run: |
        kubectl rollout status deployment/notes-api --timeout=300s
        kubectl get deployments
        kubectl get pods
        kubectl get services
    
    # ----------------------------------------------------
    # 5. Port Forwarding
    # ----------------------------------------------------
    - name: Setup port forward for testing
      run: |
        kubectl port-forward service/notes-api-service 8080:8080 &
        sleep 10
    
    # ----------------------------------------------------
    # 6. Health Check
    # ----------------------------------------------------
    - name: Validate health endpoint
      run: |
        for i in {1..10}; do
          if curl -f http://localhost:8080/health; then
            echo "Health check passed"
            break
          else
            echo "Attempt $i failed, retrying..."
            sleep 5
          fi
        done
    
    # ----------------------------------------------------
    # 7. DAST - Dynamic Application Security Testing
    # ----------------------------------------------------
    - name: Run DAST security tests
      run: |
        curl -f http://localhost:8080/health
        curl -f -X POST http://localhost:8080/notes \
          -H "Content-Type: application/json" \
          -d '{"title":"DAST Test","content":"Testing security"}'
        curl -f http://localhost:8080/notes
        curl -X POST http://localhost:8080/notes \
          -H "Content-Type: application/json" \
          -d '{"title":"","content":""}' | grep "Validation failed"
    
    # ----------------------------------------------------
    # 8. Deployment Verification
    # ----------------------------------------------------
    - name: Verify deployment status
      run: |
        kubectl get all
        POD_NAME=$(kubectl get pods -l app=notes-api -o jsonpath='{.items[0].metadata.name}')
        kubectl logs $POD_NAME --tail=20
