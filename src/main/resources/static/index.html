<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #238636 0%, #1f6feb 100%);
            border-radius: 16px;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            color: white;
        }

        .header p {
            font-size: 1em;
            color: rgba(255,255,255,0.8);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            background: #161b22;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #30363d;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #58a6ff;
        }

        .stat-label {
            color: #8b949e;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .card {
            background: #161b22;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }

        .card h2 {
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .char-counter {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            font-size: 0.8em;
            color: #484f58;
        }

        .char-counter.warning {
            color: #d29922;
        }

        .char-counter.error {
            color: #f85149;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d1d9;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 14px;
            color: #c9d1d9;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #484f58;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #2ea043;
        }

        .status-message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .status-message.success {
            background: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            border: 1px solid #238636;
            display: block;
        }

        .status-message.error {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
            border: 1px solid #f85149;
            display: block;
        }

        .notes-section h2 {
            color: #c9d1d9;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .note-item {
            background: #161b22;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #30363d;
            transition: border-color 0.2s, transform 0.2s;
        }

        .note-item:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .note-title {
            font-size: 1.2em;
            color: #f0f6fc;
            font-weight: 600;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 15px;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #21262d;
        }

        .icon-btn.edit:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .icon-btn.delete:hover {
            border-color: #f85149;
            color: #f85149;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .note-content {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
        }

        .note-content::-webkit-scrollbar {
            width: 6px;
        }

        .note-content::-webkit-scrollbar-track {
            background: #21262d;
            border-radius: 3px;
        }

        .note-content::-webkit-scrollbar-thumb {
            background: #484f58;
            border-radius: 3px;
        }

        .note-content::-webkit-scrollbar-thumb:hover {
            background: #6e7681;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #21262d;
        }

        .note-id {
            background: #21262d;
            color: #8b949e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
        }

        .note-date {
            color: #484f58;
            font-size: 0.85em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #484f58;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: #8b949e;
            margin-bottom: 10px;
        }

        .loader {
            border: 3px solid #21262d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Edit Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #30363d;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #f0f6fc;
            font-size: 1.2em;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #f0f6fc;
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Notes Management System</h1>
            <p>DevOps CI/CD Project - Spring Boot REST API</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalNotes">0</div>
                <div class="stat-label">Total Notes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="apiStatus">✅</div>
                <div class="stat-label">API Status</div>
            </div>
        </div>

        <div class="card">
            <h2>
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Create New Note
            </h2>
            <div id="createStatus" class="status-message"></div>
            <form id="createNoteForm">
                <div class="form-group">
                    <label for="noteTitle">Title</label>
                    <input type="text" id="noteTitle" placeholder="Enter note title..." required maxlength="100">
                    <div class="char-counter" id="titleCounter">0 / 100</div>
                </div>
                <div class="form-group">
                    <label for="noteContent">Content</label>
                    <textarea id="noteContent" placeholder="Write your note here..." required maxlength="5000"></textarea>
                    <div class="char-counter" id="contentCounter">0 / 5000</div>
                </div>
                <button type="submit" class="btn">Create Note</button>
            </form>
        </div>

        <div class="notes-section">
            <h2>📋 Your Notes</h2>
            <div id="notesContainer">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Note</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editNoteForm">
                <input type="hidden" id="editNoteId">
                <div class="form-group">
                    <label for="editTitle">Title</label>
                    <input type="text" id="editTitle" placeholder="Enter note title..." required maxlength="100">
                    <div class="char-counter" id="editTitleCounter">0 / 100</div>
                </div>
                <div class="form-group">
                    <label for="editContent">Content</label>
                    <textarea id="editContent" placeholder="Write your note here..." required maxlength="5000"></textarea>
                    <div class="char-counter" id="editContentCounter">0 / 5000</div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        // Fetch all notes
        async function fetchNotes() {
            try {
                const response = await fetch(`${API_BASE_URL}/notes`);
                if (!response.ok) throw new Error('Failed to fetch notes');
                const data = await response.json();
                displayNotes(data.data);
                updateStats(data.data.length);
            } catch (error) {
                console.error('Error fetching notes:', error);
                document.getElementById('notesContainer').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 8v4M12 16h.01"/>
                        </svg>
                        <h3>Connection Error</h3>
                        <p>Failed to load notes. Make sure the API is running.</p>
                    </div>
                `;
                document.getElementById('apiStatus').textContent = '❌';
            }
        }

        // Display notes
        function displayNotes(notes) {
            const container = document.getElementById('notesContainer');
            
            if (!notes || notes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <h3>No notes yet</h3>
                        <p>Create your first note to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = notes.map(note => `
                <div class="note-item">
                    <div class="note-header">
                        <div class="note-title">${escapeHtml(note.title)}</div>
                        <div class="note-actions">
                            <button class="icon-btn edit" onclick="openEditModal(${note.id}, '${escapeHtml(note.title).replace(/'/g, "\\'")}', '${escapeHtml(note.content).replace(/'/g, "\\'").replace(/\n/g, "\\n")}')" title="Edit">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </button>
                            <button class="icon-btn delete" onclick="deleteNote(${note.id})" title="Delete">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                    <line x1="10" y1="11" x2="10" y2="17"/>
                                    <line x1="14" y1="11" x2="14" y2="17"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="note-content">${escapeHtml(note.content)}</div>
                    <div class="note-meta">
                        <div class="note-id">ID: ${note.id}</div>
                        <div class="note-date">${formatDate(note.createdAt)}</div>
                    </div>
                </div>
            `).join('');
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Create note
        document.getElementById('createNoteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            const statusDiv = document.getElementById('createStatus');

            try {
                const response = await fetch(`${API_BASE_URL}/notes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = 'status-message success';
                    statusDiv.textContent = `✅ Note created successfully!`;
                    document.getElementById('createNoteForm').reset();
                    fetchNotes();
                } else {
                    statusDiv.className = 'status-message error';
                    statusDiv.textContent = `❌ ${data.message || 'Failed to create note'}`;
                }

                setTimeout(() => statusDiv.style.display = 'none', 3000);
            } catch (error) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '❌ Error creating note. Check if API is running.';
            }
        });

        // Delete note
        async function deleteNote(id) {
            if (!confirm('Are you sure you want to delete this note?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/notes/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchNotes();
                } else {
                    alert('Failed to delete note');
                }
            } catch (error) {
                alert('Error deleting note');
            }
        }

        // Edit modal functions
        function openEditModal(id, title, content) {
            document.getElementById('editNoteId').value = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editContent').value = content.replace(/\\n/g, '\n');
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // Update note
        document.getElementById('editNoteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('editNoteId').value;
            const title = document.getElementById('editTitle').value;
            const content = document.getElementById('editContent').value;

            try {
                const response = await fetch(`${API_BASE_URL}/notes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    closeEditModal();
                    fetchNotes();
                } else {
                    alert('Failed to update note');
                }
            } catch (error) {
                alert('Error updating note');
            }
        });

        // Update statistics
        function updateStats(count) {
            document.getElementById('totalNotes').textContent = count;
            document.getElementById('apiStatus').textContent = '✅';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on outside click
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEditModal();
        });

        // Character counter function
        function updateCharCounter(input, counter, maxLength) {
            const length = input.value.length;
            counter.textContent = `${length} / ${maxLength}`;
            
            // Remove all classes first
            counter.classList.remove('warning', 'error');
            
            // Add appropriate class based on length
            if (length >= maxLength) {
                counter.classList.add('error');
            } else if (length >= maxLength * 0.8) {
                counter.classList.add('warning');
            }
        }

        // Setup character counters for create form
        const noteTitle = document.getElementById('noteTitle');
        const noteContent = document.getElementById('noteContent');
        const titleCounter = document.getElementById('titleCounter');
        const contentCounter = document.getElementById('contentCounter');

        noteTitle.addEventListener('input', () => updateCharCounter(noteTitle, titleCounter, 100));
        noteContent.addEventListener('input', () => updateCharCounter(noteContent, contentCounter, 5000));

        // Setup character counters for edit form
        const editTitle = document.getElementById('editTitle');
        const editContent = document.getElementById('editContent');
        const editTitleCounter = document.getElementById('editTitleCounter');
        const editContentCounter = document.getElementById('editContentCounter');

        editTitle.addEventListener('input', () => updateCharCounter(editTitle, editTitleCounter, 100));
        editContent.addEventListener('input', () => updateCharCounter(editContent, editContentCounter, 5000));

        // Update openEditModal to also update counters
        const originalOpenEditModal = openEditModal;
        openEditModal = function(id, title, content) {
            originalOpenEditModal(id, title, content);
            // Update counters after setting values
            setTimeout(() => {
                updateCharCounter(editTitle, editTitleCounter, 100);
                updateCharCounter(editContent, editContentCounter, 5000);
            }, 0);
        };

        // Initialize
        fetchNotes();
        setInterval(fetchNotes, 30000);
    </script>
</body>
</html>
